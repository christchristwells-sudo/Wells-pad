
name: Construire APK Wells Pad

on:
  workflow_dispatch:
  push:
    paths:
      - 'Wells_Pad_Installable.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraire Wells Pad
        run: |
          test -f Wells_Pad_Installable.zip
          mkdir -p app/www
          unzip -o Wells_Pad_Installable.zip -d app/www
          test -f app/www/index.html

      - name: Creer le projet Android
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npx cap init "Wells Pad" "com.wells.pad" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compiler le APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Pad-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          
