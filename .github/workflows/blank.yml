name: Construire APK Wells Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier le fichier source
        run: test -f wells_studio_android_apk_source_1_0.zip

      - name: Decompresser le projet
        run: unzip -o wells_studio_android_apk_source_1_0.zip -d source

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Construire APK
        working-directory: source/wells_studio_android
        run: gradle --no-daemon assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Studio-APK-debug
          path: source/wells_studio_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
